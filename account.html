<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account</title>
<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; }
.tab { display: flex; gap: 10px; }
.tab button { flex: 1; background: #eee; }
.active { background: black!important; color: white!important; }
</style>
</head>
<body>
<div class="box">
<h2>Glomski Account</h2>
<div class="tab">
<button id="t1" class="active" onclick="showTab('login')">Login</button>
<button id="t2" onclick="showTab('reg')">Register Buyer</button>
</div>
<div id="loginBox">
<input id="lemail" placeholder="Email">
<input id="lpass" type="password" placeholder="Password">
<button onclick="login()" style="background:black;color:white">Login</button>
<p style="text-align:center;margin-top:10px"><a href="seller-register.html">Want to SELL? Register as Seller</a></p>
</div>
<div id="regBox" style="display:none">
<input id="rname" placeholder="Full Name">
<input id="remail" placeholder="Email">
<input id="rpass" type="password" placeholder="Password">
<button onclick="register()" style="background:gold">Create Buyer Account + ₦5000 Bonus</button>
</div>
<p style="text-align:center"><a href="index.html">Back to Marketplace</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyC_HDjcKbNMsQm6UqbM0zEdwJ1yljMzKVM",
authDomain: "glomski-store.firebaseapp.com",
projectId: "glomski-store",
storageBucket: "glomski-store.firebasestorage.app",
messagingSenderId: "610377053840",
appId: "1:610377053840:web:bb7651bd461b6dc8c88a15"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.showTab = (t) => {
document.getElementById('loginBox').style.display = t == 'login'? 'block' : 'none';
document.getElementById('regBox').style.display = t == 'reg'? 'block' : 'none';
}
window.register = async () => {
let name = document.getElementById('rname').value;
let email = document.getElementById('remail').value;
let pass = document.getElementById('rpass').value;
let cred = await createUserWithEmailAndPassword(auth, email, pass);
await setDoc(doc(db, "users", cred.user.uid), { name: name, email: email, balance: 5000, orders: 0, created: Date.now() });
location.href = 'dashboard.html';
}
window.login = async () => {
let email = document.getElementById('lemail').value;
let pass = document.getElementById('lpass').value;
await signInWithEmailAndPassword(auth, email, pass);
location.href = 'dashboard.html';
}
</script>
</body>
</html>
