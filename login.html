<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Glomski</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>GLOMSKI</h1><a href="index.html">Home</a></header>

<div style="max-width:350px;margin:50px auto;padding:20px;border:1px solid #ddd" id="box">
<h2 id="title">Create Account</h2>
<input id="name" placeholder="Full Name" style="width:100%;padding:10px;margin:5px 0">
<input id="email" placeholder="Email" style="width:100%;padding:10px;margin:5px 0">
<input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:5px 0">
<button onclick="handleAuth()" id="btn" style="width:100%;padding:12px;background:#111;color:#fff;margin-top:10px">Create Account</button>
<p style="text-align:center;margin-top:15px;font-size:14px"><span id="switchText">Already get account?</span> <a href="#" onclick="toggleForm()" id="switchLink">Login</a></p>
<p id="msg" style="color:green;text-align:center"></p>
</div>

<script>
let isLogin=false;
function toggleForm(){
isLogin=!isLogin;
document.getElementById('title').innerText=isLogin?'Login':'Create Account';
document.getElementById('btn').innerText=isLogin?'Login':'Create Account';
document.getElementById('switchText').innerText=isLogin?'No account yet?':'Already get account?';
document.getElementById('switchLink').innerText=isLogin?'Create Account':'Login';
document.getElementById('name').style.display=isLogin?'none':'block';
}
function handleAuth(){
let n=document.getElementById('name').value;
let e=document.getElementById('email').value;
let p=document.getElementById('pass').value;
if(!e||!p)return alert('Fill email and password');
if(!isLogin && !n)return alert('Fill your name');

let users=JSON.parse(localStorage.getItem('glomski_users')||'[]');
if(isLogin){
let found=users.find(u=>u.email===e && u.pass===p);
if(found){localStorage.setItem('glomski_current',JSON.stringify(found));alert('Login success!');window.location='shop.html';}
else{alert('Wrong email or password');}
}else{
if(users.find(u=>u.email===e))return alert('Email don already exist, login');
users.push({name:n,email:e,pass:p});
localStorage.setItem('glomski_users',JSON.stringify(users));
localStorage.setItem('glomski_current',JSON.stringify({name:n,email:e}));
document.getElementById('msg').innerText='Account created! Now you fit login.';
toggleForm();
}
}
</script>
</body>
  </html>
