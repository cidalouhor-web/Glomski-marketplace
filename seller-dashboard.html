<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Dashboard</title>
<style>
body { font-family: Arial; background: #f5f5f5; padding: 15px; }
.box { max-width: 600px; margin: auto; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
.bal { background: black; color: white; padding: 20px; border-radius: 12px; text-align: center; }
.bal h1 { color: gold; }
input, select { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
<div class="bal">
<p id="shop">Loading seller...</p>
<h1 id="bal">₦0</h1>
<p>Sales Balance (90% after commission)</p>
</div>
<div class="card">
<h3>Add Product</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" type="number" placeholder="Price">
<input id="pimage" placeholder="Image URL">
<select id="pcat"><option value="phones">Phones</option><option value="gadgets">Gadgets</option><option value="perfumes">Perfumes</option><option value="clothes">Clothes</option><option value="appliances">Appliances</option></select>
<button class="btn" style="background:gold" onclick="addProduct()">Submit for Approval</button>
</div>
<div class="card"><h3>My Products</h3><div id="myP"></div></div>
<div class="card"><h3>My Orders</h3><div id="myO"></div><button class="btn" style="background:black;color:white" onclick="requestWithdrawal()">Request Withdrawal</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyC_HDjcKbNMsQm6UqbM0zEdwJ1yljMzKVM",
authDomain: "glomski-store.firebaseapp.com",
projectId: "glomski-store",
storageBucket: "glomski-store.firebasestorage.app",
messagingSenderId: "610377053840",
appId: "1:610377053840:web:bb7651bd461b6dc8c88a15"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let sellerData = null;
let sellerDocId = null;
onAuthStateChanged(auth, async (u) => {
if(!u) { location.href='account.html'; return; }
let q = query(collection(db, "sellers"), where("uid","==",u.uid));
let s = await getDocs(q);
if(s.empty) { alert('Not approved seller yet'); location.href='index.html'; return; }
sellerDocId = s.docs[0].id;
sellerData = s.docs[0].data();
document.getElementById('shop').innerText = sellerData.shopName;
document.getElementById('bal').innerText = '₦' + (sellerData.balance || 0).toLocaleString();
loadProducts(); loadOrders();
});
window.addProduct = async function() {
await addDoc(collection(db, "products"), {
name: document.getElementById('pname').value,
price: parseInt(document.getElementById('pprice').value),
image: document.getElementById('pimage').value,
cat: document.getElementById('pcat').value,
sellerId: auth.currentUser.uid,
shopName: sellerData.shopName,
subaccount_code: sellerData.subaccount_code || '',
approved: false,
time: Date.now()
});
alert('Submitted! Admin will approve');
}
async function loadProducts() {
let q = query(collection(db, "products"), where("sellerId","==",auth.currentUser.uid));
let snap = await getDocs(q);
let h = '';
snap.forEach(d => { let p=d.data(); h+=`<div style="border-bottom:1px solid #eee;padding:8px">${p.name} - ₦${p.price} - ${p.approved?'Approved ✅':'Pending ⏳'}</div>`; });
document.getElementById('myP').innerHTML = h || 'None';
}
async function loadOrders() {
let q = query(collection(db, "orders"), where("sellerId","==",auth.currentUser.uid));
let snap = await getDocs(q);
let h = '';
snap.forEach(d => { let o=d.data(); h+=`<div style="border-bottom:1px solid #eee;padding:8px">${o.items.map(i=>i.name).join(', ')} - ₦${o.sellerAmount}</div>`; });
document.getElementById('myO').innerHTML = h || 'No orders';
}
window.requestWithdrawal = async function() {
await addDoc(collection(db, "withdrawals"), { sellerId: auth.currentUser.uid, shopName: sellerData.shopName, amount: sellerData.balance, bank: sellerData.bank, accountNo: sellerData.accountNo, status: 'pending', time: Date.now() });
alert('Withdrawal requested');
}
</script>
</body>
  </html>
